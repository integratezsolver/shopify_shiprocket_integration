spring:
  application:
    name: Integratez Platform

  profiles:
    active: dev
    group:
      dev: dev
      prod: prod

  config:
    import:
      - optional:classpath:config/application-dev.yml
      - optional:classpath:config/application-prod.yml

# JPA shared config
jpa:
  hibernate:
    ddl-auto: update
  properties:
    hibernate:
      format_sql: true
  show-sql: false

server:
  port: 8080

cloud:
  compatibility-verifier:
    enabled: false

# Shiprocket API Configuration
shiprocket:
  api:
    base-url: https://apiv2.shiprocket.in
    auth-endpoint: /v1/external/auth/login
    connect-timeout: 5000
    read-timeout: 10000
